name: Build APK

# Modeled on SuperBoox's workflow. Every build is a signed release APK (the release key comes from repo secrets):
#   tag v1.2.3 (or a manual run with release=1.2.3) → stable release "InkPalm+ 1.2.3"
#   push to the default branch                     → pre-release NEXT_VERSION-dev.N (Obtainium: "Include prereleases")
#   any other branch, or a PR                      → workflow artifact only (never shows up in Obtainium)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Docs/mockup-only pushes don't produce a new APK or release.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a stable release with this version (e.g. 1.0.0); leave empty for a pre-release"
        required: false
        default: ""

permissions:
  contents: write

env:
  # The version being worked towards: default-branch builds are pre-releases of it.
  NEXT_VERSION: "1.0.0"

jobs:
  build:
    # A branch push already builds the commit; only PRs from forks need their own run (and they get no secrets).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [[ -n "${{ github.event.inputs.release }}" ]]; then
            echo "name=${{ github.event.inputs.release }}" >> "$GITHUB_OUTPUT"
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "kind=stable" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" != pull_request && "${GITHUB_REF}" == "${DEFAULT_REF}" ]]; then
            echo "name=${NEXT_VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "kind=dev" >> "$GITHUB_OUTPUT"
          else
            echo "name=${NEXT_VERSION}-branch.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "kind=branch" >> "$GITHUB_OUTPUT"
          fi
      # The release key, from repo secrets, written outside the checkout and removed at the end.
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.IPP_KEYSTORE_B64 }}
        run: |
          if [[ -z "${KEYSTORE_B64}" ]]; then echo "::error::Secret IPP_KEYSTORE_B64 is missing"; exit 1; fi
          echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
      - name: Build release APK
        env:
          IPP_VERSION: ${{ steps.version.outputs.name }}
          IPP_KEYSTORE: ${{ runner.temp }}/release.jks
          IPP_KEYSTORE_PASSWORD: ${{ secrets.IPP_KEYSTORE_PASSWORD }}
          IPP_KEY_ALIAS: ${{ secrets.IPP_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Check signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | grep -q "CN=InkPalm Plus" \
            || { echo "::error::APK is not signed with the release key"; exit 1; }
          cp "$APK" "inkpalm-plus-${{ steps.version.outputs.name }}.apk"
      - name: Remove release key
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: inkpalm-plus-${{ steps.version.outputs.name }}
          path: inkpalm-plus-*.apk
      - name: Summary
        if: steps.version.outputs.kind == 'branch'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "### Test build ${{ steps.version.outputs.name }} (not published)"
            echo "From \`${BRANCH}\` at ${{ github.sha }}."
            echo "Download: ${{ steps.artifact.outputs.artifact-url }} (a .zip holding the .apk)"
          } >> "$GITHUB_STEP_SUMMARY"
      # Stable: a direct .apk link and the update Obtainium offers by default. The tag equals the APK's versionName.
      - name: Publish stable release
        if: steps.version.outputs.kind == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: InkPalm+ ${{ steps.version.outputs.name }}
          prerelease: false
          make_latest: true
          files: inkpalm-plus-*.apk
          body_path: docs/releases/v${{ steps.version.outputs.name }}.md
      # Default branch: a pre-release. Obtainium only offers these with "Include prereleases" on.
      - name: Publish pre-release
        if: steps.version.outputs.kind == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: InkPalm+ ${{ steps.version.outputs.name }} (pre-release)
          prerelease: true
          make_latest: false
          files: inkpalm-plus-*.apk
          body: |
            **Pre-release** from `${{ github.ref_name }}` at ${{ github.sha }}: new work being tested, may have rough edges.
            For the stable version, use the release marked **Latest** (once there is one).

            **Install:** download the `.apk` below on your InkPalm and open it. Later builds install over it and keep your settings.
            **Updates with Obtainium:** add `https://github.com/rn-os/inkpalm-plus`; turn on "Include prereleases" to get these.
